<!doctype html>
<html lang="tr" style="background-color: #0b0f19; color: #f9fafb;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f19" />
    <title>Şarkıyı Tahmin Et - guess the song</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap"
        rel="stylesheet"
      />
      <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      />
    </noscript>

    <!-- YouTube CDN ve Medya Sunucuları Bağlantı Optimizasyonu (Resource Hints) -->
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://www.google.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="dns-prefetch" href="https://www.youtube.com" />
    <link rel="dns-prefetch" href="https://i.ytimg.com" />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #0b0f19;
        color: #f9fafb;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        min-height: 100dvh;
        -webkit-font-smoothing: antialiased;
      }
      @keyframes gts-shell-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- iOS Safari ilk yükleme anında boş ekranı önleyen anlık App Shell -->
      <div
        style="
          display: flex;
          flex-direction: column;
          min-height: 100vh;
          min-height: 100dvh;
          background-color: #0b0f19;
          color: #f9fafb;
          position: relative;
          background-image:
            radial-gradient(600px 420px at 50% 60px, rgba(99, 102, 241, 0.20) 0%, rgba(99, 102, 241, 0) 100%),
            radial-gradient(550px 340px at 50% calc(100% - 80px), rgba(236, 72, 153, 0.14) 0%, rgba(236, 72, 153, 0) 100%);
        "
      >
        <header style="width: 100%; padding-top: 1rem; padding-bottom: 1.25rem; text-align: center;">
          <div style="min-height: 44px;"></div>
          <div style="margin-top: 0.75rem;">
            <h1
              style="
                font-size: clamp(2.25rem, 5vw, 3.75rem);
                font-weight: 800;
                letter-spacing: -0.025em;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.5rem;
                margin: 0;
              "
            >
              <span style="color: #ffffff;">şarkıyı</span>
              <span
                style="
                  background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
                  -webkit-background-clip: text;
                  background-clip: text;
                  -webkit-text-fill-color: transparent;
                  color: #818cf8;
                  font-weight: 900;
                "
              >tahmin et</span>
            </h1>
            <p style="font-size: 0.875rem; color: #9ca3af; letter-spacing: 0.025em; margin: 0.375rem 0 0; font-weight: 500;">
              bir saniyesinden parçayı tanı
            </p>
          </div>
        </header>
        <div
          style="
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem 3rem;
            gap: 0.875rem;
          "
        >
          <div
            style="
              width: 2.25rem;
              height: 2.25rem;
              border-radius: 9999px;
              border: 3px solid rgba(99, 102, 241, 0.25);
              border-top-color: #6366f1;
              animation: gts-shell-spin 0.8s linear infinite;
            "
          ></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
